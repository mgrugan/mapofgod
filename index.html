<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map of God — A 3D Atlas of the Heavens</title>
    <meta
      name="description"
      content="A cinematic, interconnected 3D atlas of the real stars — dive into any star and watch its worlds orbit."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --fg: #f0e7d8;
        --muted: #9a8f7e;
        --accent: #d7a85a;
        --accent2: #ffe2a8;
        --gold: #ffd27a;
        --panel: rgba(14, 11, 8, 0.5);
        --border: rgba(215, 168, 90, 0.28);
        --glow: 0 0 26px rgba(215, 168, 90, 0.22);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #02030a;
        color: var(--fg);
        font-family: "Rajdhani", system-ui, sans-serif;
        overflow: hidden;
        cursor: crosshair;
      }
      canvas { display: block; }

      /* faint vignette + scan tint over the whole scene */
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        box-shadow: inset 0 0 360px rgba(0, 0, 0, 0.85);
        background:
          radial-gradient(120% 120% at 50% 0%, rgba(40, 60, 140, 0.05), transparent 60%);
      }
      /* thin corner brackets for a HUD frame */
      .corner {
        position: fixed;
        width: 26px;
        height: 26px;
        border: 1px solid var(--border);
        z-index: 6;
        pointer-events: none;
      }
      .corner.tl { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
      .corner.tr { top: 14px; right: 14px; border-left: 0; border-bottom: 0; }
      .corner.bl { bottom: 14px; left: 14px; border-right: 0; border-top: 0; }
      .corner.br { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }

      #title {
        position: fixed;
        top: 26px;
        left: 34px;
        z-index: 10;
        pointer-events: none;
      }
      #title h1 {
        margin: 0;
        font-family: "Orbitron", sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 4px;
        background: linear-gradient(90deg, #ffe6b0, #d7a85a 60%, #b9763c);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: var(--glow);
      }
      #title p {
        margin: 6px 0 0;
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--muted);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        backdrop-filter: blur(10px);
        box-shadow: var(--glow);
      }

      #searchWrap {
        position: fixed;
        top: 26px;
        right: 34px;
        z-index: 10;
        width: 288px;
        padding: 12px;
      }
      #search {
        width: 100%;
        padding: 9px 12px;
        border-radius: 3px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.35);
        color: var(--fg);
        font-family: "Rajdhani", sans-serif;
        font-size: 15px;
        letter-spacing: 1px;
        outline: none;
      }
      #search:focus { border-color: var(--accent); }
      #search::placeholder { color: var(--muted); }
      #results { margin-top: 6px; max-height: 46vh; overflow-y: auto; }
      .result {
        padding: 8px 10px;
        font-size: 14px;
        letter-spacing: 0.5px;
        border-radius: 3px;
        cursor: pointer;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .result:hover {
        background: rgba(108, 123, 255, 0.15);
        color: var(--fg);
      }
      .result .con { color: var(--accent); font-size: 12px; }

      /* bottom-left readout HUD */
      #readout {
        position: fixed;
        bottom: 30px;
        left: 34px;
        z-index: 10;
        min-width: 240px;
        max-width: 340px;
        padding: 14px 16px;
        font-size: 14px;
      }
      #readout .label {
        font-family: "Orbitron", sans-serif;
        font-size: 10px;
        letter-spacing: 3px;
        color: var(--accent);
        text-transform: uppercase;
      }
      #readout .big {
        font-size: 20px;
        letter-spacing: 1px;
        margin: 4px 0 2px;
        color: var(--fg);
      }
      #readout .rows { margin-top: 8px; color: var(--muted); font-size: 13px; }
      #readout .rows div { display: flex; justify-content: space-between; gap: 16px; }
      #readout .rows b { color: var(--accent2); font-weight: 500; }

      /* bottom-center controls / breadcrumb */
      #dock {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .btn {
        padding: 9px 16px;
        font-family: "Orbitron", sans-serif;
        font-size: 11px;
        letter-spacing: 2px;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 3px;
        backdrop-filter: blur(10px);
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s;
      }
      .btn:hover { border-color: var(--accent); color: var(--accent2); }
      .btn.hidden { display: none; }
      #hint {
        font-size: 13px;
        letter-spacing: 1px;
        color: var(--muted);
        padding: 9px 14px;
      }

      #tooltip {
        display: none;
        position: fixed;
        z-index: 20;
        pointer-events: none;
        background: rgba(6, 9, 22, 0.9);
        border: 1px solid var(--border);
        border-left: 2px solid var(--accent);
        border-radius: 3px;
        padding: 8px 11px;
        font-size: 13px;
        letter-spacing: 0.5px;
        line-height: 1.5;
        white-space: nowrap;
        box-shadow: var(--glow);
      }
      #tooltip .name { font-family: "Orbitron", sans-serif; font-size: 13px; color: var(--gold); }
      #tooltip .sub { color: var(--muted); font-size: 12px; }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 50;
        background: #02030a;
        gap: 18px;
      }
      #loading .ring {
        width: 46px;
        height: 46px;
        border: 2px solid rgba(108, 123, 255, 0.2);
        border-top-color: var(--accent2);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      #loading span {
        font-family: "Orbitron", sans-serif;
        font-size: 12px;
        letter-spacing: 4px;
        color: var(--muted);
        text-transform: uppercase;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: rgba(215,168,90,0.35); border-radius: 3px; }

      /* opening reveal — the heavens emerge from darkness */
      #reveal {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: #000;
        opacity: 1;
        transition: opacity 3.2s ease;
        pointer-events: none;
      }
      #tagline {
        position: fixed;
        top: 44%;
        left: 0;
        right: 0;
        z-index: 41;
        text-align: center;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-style: italic;
        font-size: clamp(28px, 5vw, 60px);
        letter-spacing: 2px;
        color: #ffe9c2;
        text-shadow: 0 0 40px rgba(255, 200, 120, 0.55);
        opacity: 0;
        transition: opacity 2.4s ease;
        pointer-events: none;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="reveal"></div>
    <div id="tagline">Let there be light</div>

    <div id="vignette"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div id="title">
      <h1>MAP OF GOD</h1>
      <p>A living atlas of the heavens</p>
    </div>

    <div id="searchWrap" class="panel">
      <input id="search" type="text" placeholder="Seek a star — Sirius, Vega, Rigel…" autocomplete="off" />
      <div id="results"></div>
    </div>

    <div id="readout" class="panel">
      <div class="label">Domain</div>
      <div class="big" id="ro-title">The Local Heavens</div>
      <div class="rows" id="ro-rows">
        <div><span>Stars charted</span><b id="ro-count">—</b></div>
        <div><span>Span</span><b>~2,000 parsecs</b></div>
      </div>
    </div>

    <div id="dock">
      <button id="backBtn" class="btn hidden">◄ Ascend to the Heavens</button>
      <div id="hint" class="panel"><b>Click a star</b> to dive in · <b>zoom out</b> to return · search real worlds (<b>TRAPPIST-1</b>) or giants (<b>UY Scuti</b>)</div>
    </div>

    <div id="tooltip"></div>

    <div id="loading">
      <div class="ring"></div>
      <span>Charting the heavens…</span>
    </div>

    <!-- Safety net: this classic script runs even if the ES module fails to load
         (e.g. when the file is opened directly via file://). -->
    <script>
      window.__APP_READY = false;
      setTimeout(function () {
        if (window.__APP_READY) return;
        var el = document.getElementById("loading");
        if (!el) return;
        el.style.display = "flex";
        el.innerHTML =
          '<div style="max-width:560px;text-align:center;padding:24px;font-family:Rajdhani,system-ui,sans-serif">' +
          '<div style="font-family:Orbitron,sans-serif;letter-spacing:3px;color:#ffd27a;margin-bottom:14px">THE HEAVENS HAVE NOT LOADED</div>' +
          '<div style="color:#9fb0d8;font-size:15px;line-height:1.7">' +
          "This page needs to be served over <b>http</b> — it won't run if you opened the file directly (<code>file://</code>).<br><br>" +
          "From the project folder run:<br><code style=\"color:#9be8ff\">python3 -m http.server 8000</code><br>then open <code style=\"color:#9be8ff\">http://localhost:8000</code><br><br>" +
          "Or deploy it free with GitHub Pages (see the README). A working internet connection is needed for the 3D engine." +
          "</div></div>";
      }, 8000);
    </script>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
